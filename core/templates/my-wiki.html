<style>

<script id="wiki-core">
/* The page's own logic, with no DOM in it: search and appearance. It is a separate block on
   purpose — this is what the suite runs headlessly, so the eval exercises the code that ships
   instead of a copy of it. */
var WIKI = (function () {
  var STORE_KEY = 'my-wiki:appearance';
  var DEFAULTS = {accent: '#4b5563', font: 'sans', size: 'M', dark: false};

  function readAppearance(store) {
    var out = {accent: DEFAULTS.accent, font: DEFAULTS.font, size: DEFAULTS.size, dark: DEFAULTS.dark};
    try {
      var raw = store && store.getItem(STORE_KEY);
      if (raw) {
        var got = JSON.parse(raw);
        for (var k in out) { if (Object.prototype.hasOwnProperty.call(got, k)) out[k] = got[k]; }
      }
    } catch (e) { /* a browser with site data blocked reads as no preference, never as a failure */ }
    return out;
  }

  function writeAppearance(store, patch) {
    var next = readAppearance(store);
    for (var k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) next[k] = patch[k]; }
    try { store && store.setItem(STORE_KEY, JSON.stringify(next)); } catch (e) {}
    return next;
  }

  function pageText(page) {
    var parts = [page.title || ''];
    if (page.summary) parts.push(page.summary);
    var s = page.sections || [];
    for (var i = 0; i < s.length; i++) {
      parts.push(s[i].name || '');
      parts.push(s[i].text || '');
    }
    return parts.join('\n');
  }

  /* Accent-insensitive, and character for character: the folded string has to keep the same
     length as the raw one, because the index of a match in the folded text is what cuts the
     fragment out of the raw text. A plain NFD normalise moves every index after the first accent. */
  function fold(s) {
    s = (s || '').toLowerCase();
    if (!s.normalize) return s;
    return s.replace(/[^\u0000-\u007F]/g, function (c) {
      var d = c.normalize('NFD');
      return d.length ? d.charAt(0) : c;
    });
  }

  function index(data) {
    var rows = [];
    for (var path in data.pages) {
      var p = data.pages[path];
      rows.push({path: path, page: p, hay: fold(pageText(p)), title: fold(p.title || '')});
    }
    return rows;
  }

  function fragment(hay, raw, at) {
    var start = Math.max(0, at - 60), end = Math.min(raw.length, at + 140);
    var frag = raw.slice(start, end).replace(/\s+/g, ' ').trim();
    return (start > 0 ? '…' : '') + frag + (end < raw.length ? '…' : '');
  }

  /* One result per page, with the fragment of its first match. Title matches rank first, then
     matches in the body, then how early in the page the match sits. */
  function search(rows, query, ws) {
    var q = fold(query).trim();
    if (!q) return [];
    var terms = q.split(/\s+/), out = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (ws && r.page.ws !== ws) continue;
      /* The fragment is cut around the LONGEST term, not the first one: with "historia de Orca",
         "de" matches in the second line of every page and would show a fragment about nothing. */
      var ok = true, at = -1, pick = terms[0], picked = -1;
      for (var t = 0; t < terms.length; t++) {
        var k = r.hay.indexOf(terms[t]);
        if (k < 0) { ok = false; break; }
        if (at < 0 || k < at) at = k;
        if (terms[t].length > pick.length || picked < 0) { pick = terms[t]; picked = k; }
      }
      if (!ok) continue;
      var raw = pageText(r.page);
      out.push({
        path: r.path, page: r.page, at: at,
        inTitle: r.title.indexOf(pick) >= 0,
        fragment: fragment(r.hay, raw, picked < 0 ? at : picked),
        term: pick
      });
    }
    out.sort(function (a, b) {
      if (a.inTitle !== b.inTitle) return a.inTitle ? -1 : 1;
      if (a.at !== b.at) return a.at - b.at;
      return a.path < b.path ? -1 : 1;
    });
    return out;
  }

  /* Navigation (spec 063 C1) ---------------------------------------------------- */
  /* A tiny history stack of the app's own — a route string per stop, and a pointer into it.
     `wiki-view` drives the real `window.history` off this same shape (a route pushed here is a
     route pushed there too), but the shape itself is DOM-free on purpose: it is what the suite
     runs headlessly, the same way it already does for search and appearance. */
  function navCreate(route) { return {stack: [route], pos: 0}; }
  function navGo(nav, route) {
    if (nav.stack[nav.pos] === route) return nav;
    var stack = nav.stack.slice(0, nav.pos + 1);
    stack.push(route);
    return {stack: stack, pos: stack.length - 1};
  }
  function navBack(nav) { return nav.pos > 0 ? {stack: nav.stack, pos: nav.pos - 1} : nav; }
  function navForward(nav) {
    return nav.pos < nav.stack.length - 1 ? {stack: nav.stack, pos: nav.pos + 1} : nav;
  }
  function navCurrent(nav) { return nav.stack[nav.pos]; }
  function navCanBack(nav) { return nav.pos > 0; }
  function navCanForward(nav) { return nav.pos < nav.stack.length - 1; }

  /* Collapse state (spec 063 C4), one workspace at a time so switching workspaces never mixes
     one's entities into another's. Missing entirely reads as "everything collapsed": the caller
     decides which entity opens by default (the active one) rather than this module guessing. */
  function collapseKey(wsSlug) { return 'my-wiki:collapse:' + wsSlug; }
  function readCollapse(store, wsSlug) {
    try {
      var raw = store && store.getItem(collapseKey(wsSlug));
      if (raw) return JSON.parse(raw);
    } catch (e) { /* blocked site data reads as nothing stored, never as a failure */ }
    return {};
  }
  function writeCollapse(store, wsSlug, patch) {
    var next = readCollapse(store, wsSlug);
    for (var k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) next[k] = patch[k]; }
    try { store && store.setItem(collapseKey(wsSlug), JSON.stringify(next)); } catch (e) {}
    return next;
  }

  /* The tree of the sidebar (spec 063 C2, C3) ------------------------------------ */
  var ORPHANS_KEY = '__orphans__';
  var DOC_INLINE_CAP = 12;

  /* Which entity a page hangs from, for expanding it when that page is the one open. An entity
     names itself; an initiative names it through `about`; a document names it through `owner`,
     one hop further if that owner is itself an initiative. Anything else — a workspace home, a
     person, an initiative or document with no entity above it — expands nothing. */
  function activeEntityFor(data, path) {
    var p = path && data.pages[path];
    if (!p) return '';
    if (p.kind === 'entity') return path;
    if (p.kind === 'initiative') return p.about || '';
    if (p.kind === 'document' && p.owner) {
      var owner = data.pages[p.owner];
      if (!owner) return '';
      if (owner.kind === 'entity') return p.owner;
      if (owner.kind === 'initiative') return owner.about || '';
    }
    return '';
  }

  /* One entry per entity, never one per initiative or document (C2): the shape a shelf's `pages`
     already has from the builder (spec 060) IS the entity list, so nothing here invents a level —
     it only decides what shows open, and whether an entity's own documents list inline or as a
     count. A shelf, an entity, and the orphans group are each collapsed unless the map says
     otherwise or they are the one the active page hangs from. */
  function sidebarTree(data, wsSlug, activePath, collapse) {
    collapse = collapse || {};
    var ws = null;
    for (var i = 0; i < data.workspaces.length; i++) {
      if (data.workspaces[i].slug === wsSlug) ws = data.workspaces[i];
    }
    if (!ws) return {shelves: [], orphans: null};
    var activeEntity = activeEntityFor(data, activePath);
    function isOpen(key) {
      // The active page's entity is expanded once, when the page opens (ensureExpanded); after
      // that the reader can fold it like any other group. Forcing it open here made it unfoldable.
      if (Object.prototype.hasOwnProperty.call(collapse, key)) return !collapse[key];
      return key === activeEntity;
    }
    var shelves = ws.shelves.map(function (shelf) {
      return {
        type: shelf.type,
        label: shelf.label,
        entities: shelf.pages.map(function (path) {
          var e = data.pages[path];
          var docCount = (e.docs || []).length;
          return {
            path: path,
            title: e.title,
            open: isOpen(path),
            active: path === activePath,
            initiatives: e.children.slice(),
            docs: docCount > 0 && docCount < DOC_INLINE_CAP ? e.docs.slice() : [],
            docCount: docCount
          };
        })
      };
    });
    var orphans = ws.orphans.length ? {
      key: ORPHANS_KEY,
      open: isOpen(ORPHANS_KEY),
      count: ws.orphans.length,
      paths: ws.orphans.slice()
    } : null;
    return {shelves: shelves, orphans: orphans};
  }

  return {
    STORE_KEY: STORE_KEY, DEFAULTS: DEFAULTS,
    readAppearance: readAppearance, writeAppearance: writeAppearance,
    index: index, search: search, pageText: pageText, fold: fold,
    navCreate: navCreate, navGo: navGo, navBack: navBack, navForward: navForward,
    navCurrent: navCurrent, navCanBack: navCanBack, navCanForward: navCanForward,
    collapseKey: collapseKey, readCollapse: readCollapse, writeCollapse: writeCollapse,
    activeEntityFor: activeEntityFor, sidebarTree: sidebarTree,
    ORPHANS_KEY: ORPHANS_KEY, DOC_INLINE_CAP: DOC_INLINE_CAP
  };
})();
if (typeof module !== 'undefined' && module.exports) { module.exports = WIKI; }
</script>

  function icon(name, size) {

  function page(path) { return DATA.pages[path]; }

  /* The breadcrumb (spec 063 C5): workspace, then the entity a page hangs from — an initiative's

     the page itself, never a link. Used both by the header and by a page's own crumb line. */
  function crumbTrail(path) {
    var p = page(path), trail = [];

    for (var i = 0; i < DATA.workspaces.length; i++) { if (DATA.workspaces[i].slug === p.ws) w = DATA.workspaces[i]; }
    if (w) trail.push({title: w.title, path: w.home});
    if (path === (w && w.home)) { trail[0].current = true; return trail; }
    var ent = WIKI.activeEntityFor(DATA, path);
    if (ent && ent !== path) {
      var ep = page(ent);
      trail.push({title: ep.title, path: ent});

  }
  function crumbHtml(path) {
    // One breadcrumb, in the header. Every segment shortens with an ellipsis on its own; with more
    // than three segments the middle ones fold into "…" that shows them on hover.
    var trail = crumbTrail(path), parts = [];
    if (trail.length > 3) {

      } else if (c.current) {

      } else {

  /* Appearance ------------------------------------------------------------------ */

  /* Collapse state (spec 063 C4) -------------------------------------------------- */

  /* Sidebar --------------------------------------------------------------------- */

    // (the workspace's home and every entity, initiative and document page).
    var curPath = state.route.charAt(0) === '/' ? state.route.slice(1) : '';
    var curPage = curPath ? page(curPath) : null;
    var inPeople = state.route === 'people' || (curPage && curPage.kind === 'person');
    var inWiki = !inPeople && state.route !== 'overview' && state.route !== 'search' && state.route !== 'graph';
    var isHome = inWiki;
    h.push('<a class="it' + (state.route === 'overview' ? ' on' : '') + '" href="#overview">' + WIKI_OVERVIEW.icon('grid', 16) + '<span>' + esc(T('WIKI_OVERVIEW', 'Overview')) + '</span></a>');
    h.push('<a class="it' + (isHome ? ' on' : '') + '" href="' + href(w.home) + '">' + icon('book') + '<span>' + esc(T('WIKI_TITLE', 'My Wiki')) + '</span></a>');
    h.push('<a class="it' + (inPeople ? ' on' : '') + '" href="#people">' + icon('people') + '<span>' + esc(T('WIKI_PEOPLE', 'People')) + '</span></a>');
    h.push('<a class="it' + (state.route === 'graph' ? ' on' : '') + '" href="#graph">' + icon('graph') + '<span>' + esc(T('WIKI_GRAPH', 'Graph')) + '</span></a>');
    h.push('</div><div class="pages">');
    var activePath = state.route.charAt(0) === '/' ? state.route.slice(1) : '';
    if (inPeople) {
      // In People the tree is the people of this workspace, the open one marked.
      var folks = [];
      for (var pk in DATA.pages) { if (DATA.pages[pk].kind === 'person' && DATA.pages[pk].ws === w.slug) folks.push(DATA.pages[pk]); }
      folks.sort(function (x, y) { return x.title.localeCompare(y.title); });
      h.push('<div class="grp">' + esc(T('WIKI_PEOPLE', 'People')) + '</div>');
      if (!folks.length) h.push('<span class="p sub muted">' + esc(T('WIKI_NO_PEOPLE', 'No people yet')) + '</span>');
      folks.forEach(function (f) {
        h.push('<div class="ent leaf"><span class="chev-gap"></span><a class="p' + (activePath === f.path ? ' on' : '') + '" href="' + href(f.path) + '"><span>' + esc(f.title) + '</span></a></div>');
      });

      h.push('<div class="grp">' + esc(shelf.label) + '</div>');

            'aria-expanded="' + (ent.open ? 'true' : 'false') + '">' + icon('chevron', 13) + '</button>');
        } else {
          h.push('<span class="chev-gap"></span>');
        }
        h.push('<a class="p' + (ent.active ? ' on' : '') + '" href="' + href(ent.path) + '"><span>' + esc(ent.title) + '</span></a>');
        h.push('</div>');
        if (!ent.open || !hasKids) return;
        ent.initiatives.forEach(function (c) {
          h.push('<a class="p sub' + (state.route === '/' + c ? ' on' : '') + '" href="' + href(c) + '"><span>' + esc(page(c).title) + '</span></a>');
        });

          ent.docs.forEach(function (d) {
            h.push('<a class="p sub" href="' + href(d.path) + '"' + (state.route === '/' + d.path ? ' data-on="1"' : '') + '><span>' + esc(page(d.path).title) + '</span></a>');
          });

      h.push('<span class="p muted"><span>' + esc(T('WIKI_NO_ENTITY', 'No entity')) + ' · ' + tree.orphans.count + '</span></span>');
      h.push('</div>');

  }
  function sidebarFoot() {

  /* Pieces ---------------------------------------------------------------------- */
  function editButton(path) {
    // Obsidian's own URI. Opened from a local file or a desktop app it launches Obsidian on that

    // the click also copies the path and says so — the reader never gets a dead button.
    var file = path.replace(/\.md$/, '');
    var url = 'obsidian://open?vault=' + encodeURIComponent(DATA.vault) + '&file=' + encodeURIComponent(file);
    return '<a class="btn" id="edit-md" href="' + esc(url) + '" data-obsidian="' + esc(url) + '" data-copy="' + esc(path) + '">' + icon('edit', 14) + ' ' + esc(T('WIKI_EDIT', 'Edit markdown')) + '</a>';
  }
  function toast(text) {
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }

  function chips(fm) {

  }
  function listItem(title, detail, tail) {

  }
  function sectionHtml(s) {
    var h = ['<h2 id="s-' + esc(s.name.replace(/\s+/g, '-')) + '">' + icon(s.icon, 18) + ' ' + esc(s.name) + '</h2>'];
    if (s.form === 'tasks') {
      s.items.forEach(function (i) {
        h.push('<div class="task' + (i.done ? ' done' : '') + '"><span class="box">' + (i.done ? icon('check', 11) : '') + '</span>' +

      });
    } else if (s.form === 'decisions') {
      s.items.forEach(function (i) {
        h.push(listItem(esc(i.text), i.date ? esc(i.date) : '', '<span class="chip">' + esc(T('WIKI_DECISION', 'decision')) + '</span>'));
      });
    } else if (s.form === 'people') {
      s.items.forEach(function (i) {
        var target = null;
        for (var p in DATA.pages) { if (DATA.pages[p].kind === 'person' && p.indexOf(i.person) >= 0) { target = p; break; } }
        var label = esc(i.text);

          '<span class="chip">' + esc(T('WIKI_PERSON', 'person')) + '</span>'));

  /* A node's documents come out grouped by the folder they live in — `decisions/`, `research/`,

  var DOC_CAP = 25;

    var by = {}, order = [];
    (p.docs || []).forEach(function (d) {
      var g = d.group || T('WIKI_DOCUMENTS', 'Documents');
      if (!by[g]) { by[g] = []; order.push(g); }
      by[g].push(d);
    });
    order.sort();
    return order.map(function (g) {
      var items = by[g].slice().sort(function (a, b) { return a.path < b.path ? 1 : -1; });
      return {name: g, label: g.charAt(0).toUpperCase() + g.slice(1), items: items};
    });

  function sectionIcon(name) {

    var tbl = DATA.icons || {};

    for (var i = 0; i < cands.length; i++) {
      var c = cands[i], c1 = c.charAt(c.length - 1) === 's' ? c.slice(0, -1) : c;

  function docSections(p) {
    var h = [];

        icon(sectionIcon(g.name), 18) + ' ' + esc(g.label) +

        '</h2>');

  function toc(names) {

  function devHtml(dev) {

  /* Views ----------------------------------------------------------------------- */
  function viewPage(path) {
    var p = page(path);
    if (!p) return '<h1>' + esc(T('WIKI_NOT_FOUND', 'Nothing here')) + '</h1>';
    var h = ['<div class="actions">' + editButton(path) + '</div>'];
    h.push('<h1>' + esc(p.title) + '</h1>');
    var meta = chips(p.fm);
    if (meta) h.push('<div class="meta">' + meta + '</div>');
    if (p.lede) h.push('<div class="lede">' + p.lede + '</div>');

    var names = [];
    if (p.children.length) names.push(T('WIKI_INITIATIVES', 'Initiatives'));
    p.sections.forEach(function (s) { names.push(s.name); });
    if (p.dev) names.push(T('WIKI_DEVELOPMENT', 'Development'));
    docGroups(p).forEach(function (g) { names.push(g.label); });
    if (p.kind === 'person') names.push(T('WIKI_MENTIONS', 'Mentions'));
    h.push(toc(names));

    if (p.children.length) {
      h.push('<h2 id="s-' + esc(T('WIKI_INITIATIVES', 'Initiatives').replace(/\s+/g, '-')) + '">' + icon('flag', 18) + ' ' + esc(T('WIKI_INITIATIVES', 'Initiatives')) + '</h2>');
      p.children.forEach(function (c) {
        var e = page(c);
        h.push(listItem('<a href="' + href(c) + '">' + esc(e.title) + '</a>' +
          (e.fm.status ? ' <span class="chip ' + (e.fm.status === 'active' ? 'ok' : '') + '" style="margin-left:6px">' + esc(e.fm.status) + '</span>' : ''),
          esc(e.summary || '')));
      });
    }
    p.sections.forEach(function (s) { h.push(sectionHtml(s)); });
    if (p.dev) h.push(devHtml(p.dev));
    h.push(docSections(p));
    if (p.kind === 'person') {
      h.push('<h2 id="s-' + esc(T('WIKI_MENTIONS', 'Mentions').replace(/\s+/g, '-')) + '">' + icon('link', 18) + ' ' + esc(T('WIKI_MENTIONS', 'Mentions')) + '</h2>');
      if (!p.mentions.length) h.push('<div class="note">' + esc(T('WIKI_NO_MENTIONS', 'Nobody mentions this page yet.')) + '</div>');
      p.mentions.forEach(function (m) {
        h.push(listItem('<a href="' + href(m.path) + '">' + esc(m.title) + '</a>', '',
          '<span class="chip">' + esc(m.kind) + '</span>'));
      });
    }
    return h.join('');
  }

  function viewWorkspace(path) {
    var w = ws(), p = page(path);
    var h = ['<div class="actions">' + editButton(path) + '</div>'];
    h.push('<h1>' + esc(p.title) + '</h1>');
    var count = 0;
    w.shelves.forEach(function (s) { count += s.pages.length; });
    h.push('<div class="meta"><span>' + esc(DATA.generated) + '</span><span>·</span><span>' +
      count + ' ' + esc(T('WIKI_ENTITIES', 'entities')) + '</span></div>');
    if (p.lede) h.push('<div class="lede">' + p.lede + '</div>');
    h.push(toc(w.shelves.map(function (s) { return s.label; })
      .concat(docGroups(p).map(function (g) { return g.label; }))));
    if (!w.shelves.length) {
      h.push('<div class="note">' + esc(T('WIKI_EMPTY', 'Nothing here yet')) + '</div>');
    }
    w.shelves.forEach(function (shelf) {
      h.push('<h2 id="s-' + esc(shelf.label.replace(/\s+/g, '-')) + '">' + icon(shelf.icon && ICONS[shelf.icon] ? shelf.icon : sectionIcon(shelf.type || shelf.label), 18) + ' ' + esc(shelf.label) + '</h2>');
      shelf.pages.forEach(function (pp) {
        var e = page(pp);
        h.push(listItem('<a href="' + href(pp) + '">' + esc(e.title) + '</a>' +
          (e.children.length ? ' <span class="chip vio" style="margin-left:6px">' + e.children.length + '</span>' : ''),
          esc(e.summary || '')));
      });
    });
    if (w.orphans.length) {
      h.push('<h2>' + icon('flag', 18) + ' ' + esc(T('WIKI_NO_ENTITY', 'No entity')) + '</h2>');
      w.orphans.forEach(function (c) {
        var e = page(c);
        h.push(listItem('<a href="' + href(c) + '">' + esc(e.title) + '</a>', esc(e.summary || '')));
      });
    }
    p.sections.forEach(function (s) { h.push(sectionHtml(s)); });
    h.push(docSections(p));
    return h.join('');
  }

  function viewPeople() {
    var w = ws();
    var h = ['<h1>' + esc(T('WIKI_PEOPLE', 'People')) + '</h1>'];
    h.push('<div class="meta"><span>' + w.people.length + '</span></div>');
    if (!w.people.length) h.push('<div class="note">' + esc(T('WIKI_NO_PEOPLE', 'No people in this workspace yet.')) + '</div>');
    w.people.forEach(function (p) {
      var e = page(p);
      h.push(listItem('<a href="' + href(p) + '">' + esc(e.title) + '</a>', esc(e.summary || ''),
        '<span class="chip">' + e.mentions.length + '</span>'));
    });
    return h.join('');
  }

  function mark(text, term) {
    var i = WIKI.fold(text).indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<span class="hl">' + esc(text.slice(i, i + term.length)) + '</span>' + esc(text.slice(i + term.length));
  }

  function viewSearch() {
    var w = ws();
    var res = WIKI.search(ROWS, state.query, w.slug);
    var h = ['<h1>' + esc(state.query) + '</h1>'];
    h.push('<div class="meta"><span>' + res.length + ' ' + esc(T('WIKI_RESULTS', 'results')) + '</span></div>');
    if (!res.length) h.push('<div class="note">' + esc(T('WIKI_NO_RESULTS', 'No results.')) + '</div>');
    res.slice(0, 60).forEach(function (r) {
      h.push(listItem('<a href="' + href(r.path) + '">' + esc(r.page.title) + '</a>',
        mark(r.fragment, r.term), '<span class="chip">' + esc(r.page.kind) + '</span>'));
    });
    return h.join('');
  }

  /* Shell ----------------------------------------------------------------------- */
  function body() {
    if (state.route === 'overview') return WIKI_OVERVIEW.view(DATA, ws(), T, esc, href);
    if (state.route === 'people') return viewPeople();
    if (state.route === 'graph') return '<h1>' + esc(T('WIKI_GRAPH', 'Graph')) + '</h1><div id="graph-root"></div>';
    if (state.route === 'search') return viewSearch();
    var path = state.route.charAt(0) === '/' ? state.route.slice(1) : '';
    var p = page(path);
    if (!p) return viewWorkspace(ws().home);
    if (p.kind === 'workspace') return viewWorkspace(path);
    return viewPage(path);
  }

  /* Header ------------------------------------------------------------------------ */
  function activePath() { return state.route.charAt(0) === '/' ? state.route.slice(1) : ''; }
  function topCrumb() {
    var p = activePath();
    if (state.route === 'people') return '<b>' + esc(T('WIKI_PEOPLE', 'People')) + '</b>';
    if (state.route === 'search') return '<b>' + esc(state.query) + '</b>';
    if (p && page(p)) return crumbHtml(p);
    return '<b>' + esc(ws().title) + '</b>';
  }

  function render() {
    var w = ws();
    if (!w) { app.innerHTML = '<div class="content"><h1>' + esc(T('WIKI_EMPTY', 'Nothing here yet')) + '</h1></div>'; return; }
    var canBack = state.nav ? WIKI.navCanBack(state.nav) : false;
    var canFwd = state.nav ? WIKI.navCanForward(state.nav) : false;
    // Re-rendering rebuilds the whole shell. A click on the sidebar (collapse, appearance) must
    // not move the reader: keep the sidebar's scroll always, and the page's scroll when the
    // route did not change. A new page starts at the top, as a page should.
    var prevSide = app.querySelector('.side');
    var sideTop = prevSide ? prevSide.scrollTop : 0;
    var sameRoute = (render.lastRoute === state.route);
    var pageY = sameRoute ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
    render.lastRoute = state.route;
    app.innerHTML = sidebar() +
      '<div class="main"><div class="top">' +
      '<button class="navbtn" id="nav-back" title="' + esc(T('WIKI_BACK', 'Back')) + '" aria-label="' + esc(T('WIKI_BACK', 'Back')) + '"' + (canBack ? '' : ' disabled') + '>' + icon('arrowLeft', 15) + '</button>' +
      '<button class="navbtn" id="nav-fwd" title="' + esc(T('WIKI_FORWARD', 'Forward')) + '" aria-label="' + esc(T('WIKI_FORWARD', 'Forward')) + '"' + (canFwd ? '' : ' disabled') + '>' + icon('arrowRight', 15) + '</button>' +
      '<span class="crumb">' + topCrumb() + '</span>' +
      '<form id="q-form">' + icon('search', 14) +
      '<input id="q" placeholder="' + esc(T('WIKI_SEARCH', 'Search your brain…')) + '" value="' + esc(state.route === 'search' ? state.query : '') + '"></form></div>' +
      '<div class="content">' + body() + '</div></div>';
    wire();
    var newSide = app.querySelector('.side');
    if (newSide) newSide.scrollTop = sideTop;
    if (sameRoute) window.scrollTo(0, pageY);
    if (state.route === 'graph') {
      var gr = document.getElementById('graph-root');
      if (gr) WIKIGRAPH.mount(gr, DATA, T, href, {ws: w.slug});
    }
    try {
      var on = app.querySelector('.side .p.on');
      // Bring the active entry into the sidebar's own view without touching the page's scroll:
      // scrollIntoView would drag the window along and open every page half-scrolled.
      var sideEl = on ? on.closest('.side') : null;
      if (on && sideEl) {
        var r = on.getBoundingClientRect(), sr = sideEl.getBoundingClientRect();
        if (r.top < sr.top || r.bottom > sr.bottom) sideEl.scrollTop += r.top - sr.top - sr.height / 2;
      }
    } catch (e) {}
  }

  function wire() {
    var pick = document.getElementById('ws-pick');
    if (pick) pick.onchange = function () {
      state.ws = pick.value;
      var w = ws();
      // Overview is a screen of the workspace on screen: switching the workspace stays on it,
      // and does not throw the reader back to a page they did not ask for.
      location.hash = state.route === 'overview' ? '#overview' : '#/' + w.home;
      if (state.route === 'overview') render();
    };
    var form = document.getElementById('q-form');
    if (form) form.onsubmit = function (e) {
      e.preventDefault();
      if (state.route !== 'search') state.preSearch = state.route;
      state.query = document.getElementById('q').value;
      location.hash = '#search';
    };
    var back = document.getElementById('nav-back');
    if (back) back.onclick = function () { history.back(); };
    var fwd = document.getElementById('nav-fwd');
    if (fwd) fwd.onclick = function () { history.forward(); };
    Array.prototype.forEach.call(app.querySelectorAll('a.resume[data-resume]'), function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var cmd = a.getAttribute('data-resume');
        try { navigator.clipboard.writeText(cmd); } catch (err) {}
        toast(esc(T('WIKI_THREAD_COPIED', 'Copied — paste it in a terminal:')) + ' ' + cmd);
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('a.anchor[data-anchor]'), function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('data-anchor'));
        if (!target) return;
        var top = target.getBoundingClientRect().top + (window.pageYOffset || 0) - 64;
        window.scrollTo(0, top);
      };
    });
    var at = document.getElementById('appear-toggle');
    if (at) at.onclick = function () { state.appearOpen = !state.appearOpen; render(); };
    var edit = document.getElementById('edit-md');
    if (edit) edit.onclick = function (e) {
      e.preventDefault();
      var url = edit.getAttribute('data-obsidian'), path = edit.getAttribute('data-copy');
      var copied = false;
      try { navigator.clipboard.writeText(path); copied = true; } catch (err) {}
      var left = false;
      window.addEventListener('blur', function () { left = true; }, {once: true});
      try { window.location.href = url; } catch (err) {}
      setTimeout(function () {
        if (!left) toast((copied ? esc(T('WIKI_EDIT_COPIED', 'Obsidian could not be opened from here; the path is copied:')) : esc(T('WIKI_EDIT_PATH', 'Open in Obsidian:'))) + ' ' + path);
      }, 900);
    };
    Array.prototype.forEach.call(app.querySelectorAll('[data-toggle]'), function (b) {
      b.onclick = function () { toggleCollapse(b.getAttribute('data-toggle')); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-accent]'), function (b) {
      b.onclick = function () { setLook({accent: b.getAttribute('data-accent')}); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-font]'), function (b) {
      b.onclick = function () { setLook({font: b.getAttribute('data-font')}); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-size]'), function (b) {
      b.onclick = function () { setLook({size: b.getAttribute('data-size')}); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-dark]'), function (b) {
      b.onclick = function () { setLook({dark: b.getAttribute('data-dark') === '1'}); };
    });
    /* The sandbox of a published page may refuse the vault scheme. The click is not trusted to
       land: the path goes to the clipboard as well, and the button says so. */
    Array.prototype.forEach.call(app.querySelectorAll('[data-copy]:not(#edit-md)'), function (a) {
      a.onclick = function () {
        try { navigator.clipboard.writeText(a.getAttribute('data-copy')); } catch (e) {}
      };
    });
  }

  /* Routing and history (spec 063 C1) --------------------------------------------------------
     Every page change lands on a route in the hash, so the browser's own back/forward can retrace
     it. `history` state carries `navPos`, our own stack's pointer: the header's ← → buttons and
     the physical back/forward button both end up in the same place, because both drive the same
     `state.nav`.

     A browser fires BOTH `hashchange` and `popstate` for every fragment navigation — a link click
     as much as an actual back/forward — so neither event on its own says which one happened.
     `history.state` does: an entry we have already stamped with `replaceState({navPos})` carries
     that stamp back on a real traversal, and a brand-new entry (a click) carries none. `lastHash`
     only keeps the two events from processing the same landing twice, whichever fires first. */
  var lastHash = null;

  function routeOf(hash) {
    var h = (hash || '').replace(/^#/, '');
    if (!h) return 'overview';
    return h;
  }

  function applyRoute(r) {
    state.route = r;
    var p = page(r.replace(/^\//, ''));
    if (p && p.ws) state.ws = p.ws;
    if (r.charAt(0) === '/') ensureExpanded(r.slice(1));
    render();
  }

  function handleRoute(evState) {
    var r = routeOf(location.hash);
    if (r === lastHash) return;
    lastHash = r;
    var st = evState !== undefined ? evState : history.state;
    if (st && typeof st.navPos === 'number' && state.nav && state.nav.stack[st.navPos] === r) {
      state.nav = {stack: state.nav.stack, pos: st.navPos};
    } else {
      state.nav = state.nav ? WIKI.navGo(state.nav, r) : WIKI.navCreate(r);
      try { history.replaceState({navPos: state.nav.pos}, '', location.href); } catch (e) {}
    }
    applyRoute(r);
  }

  window.addEventListener('hashchange', function () { handleRoute(undefined); });
  window.addEventListener('popstate', function (e) { handleRoute(e.state); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || state.route !== 'search') return;
    var target = state.preSearch || (ws() ? '/' + ws().home : '');
    if (state.nav && WIKI.navCanBack(state.nav)) { history.back(); return; }
    location.hash = target;
  });

  applyLook();
  handleRoute(undefined);
})();
</script>
